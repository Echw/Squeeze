[workspace]
resolver = "2"
members = [
  "crates/optimizer-core",
  "crates/optimizer-cli",
  "crates/optimizer-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0.99"
butteraugli = { version = "0.9.3", default-features = false }
crc32fast = "1.5.1"
clap = { version = "4.5.48", features = ["derive"] }
fast-ssim2 = { version = "0.8.2", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
js-sys = "0.3.81"
libc = "0.2.182"
oxipng = { version = "10.2.1", default-features = false, features = ["freestanding", "zopfli"] }
mozjpeg-rs = { version = "0.9.2", default-features = false, features = ["fast-yuv", "imgref"] }
png = "0.18.0"
rgb = "0.8.52"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
wasm-bindgen = "0.2.104"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
